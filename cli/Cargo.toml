[package]
name = "vedavid-dash"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Command-line compiler for the Vedavid dashboard DSL"
repository = "https://github.com/vedavid-dev/dashboard-dsl"

[[bin]]
name = "vedavid-dash"
path = "src/main.rs"

[dependencies]
vedavid-dashboard-dsl = { path = "..", version = "0.1.0", features = ["schema"] }
serde_json = "1"
schemars = "0.8"
