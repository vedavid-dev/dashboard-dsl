[package]
name = "vedavid-dashboard-dsl"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Compiles the Vedavid dashboard DSL into a render tree"
repository = "https://github.com/vedavid-dev/dashboard-dsl"
categories = ["compilers"]
keywords = ["prometheus", "dashboard", "promql"]

[workspace]
members = ["cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
sha2 = "0.10"
schemars = { version = "0.8", optional = true }

[features]
schema = ["schemars"]
